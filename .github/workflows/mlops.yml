name: mlops

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Data pipeline
        run: python data_pipeline.py
      - name: Train
        run: python train.py --fast
      - name: Test
        run: pytest -q
